# The plugin package's own bundle patch — the DIRECT mount layer.
#
# Installing this package as a profile dependency (`dsh plugin --profile web
# add "link:$PWD"`) appends it to `dsh.profile.bundles`; this layer inserts the
# plugin row with an empty config, so the plugin resolves its roots itself at
# start ($DSH_AGENT_SWARM_ROOT, else <Harness home>/agent-swarm; see
# src/state-roots.ts) unless a caller overlay configures absolute ones. The
# preview deployment uses this path until the attended deployment swaps the
# mount.
#
# The DECLARED mount is the bundle package in `profile/`: it inserts the same
# row id with the same empty config, declares its prerequisites and this layer
# as a conflict, and composes the Web client UI with the same row. Mount one or
# the other, never both.
- insert:
    - id: dsh-external-agent-swarm
      name: '@dsh-external/dsh-agent-swarm'
      config: {}
